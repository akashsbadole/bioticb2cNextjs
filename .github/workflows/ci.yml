name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci-test.db"
      JWT_SECRET: "${{ secrets.JWT_SECRET || 'ci_test_secret_at_least_32_chars_long_1234567890' }}"
      AUTH_SECRET: "${{ secrets.AUTH_SECRET || 'ci_test_secret_at_least_32_chars_long_1234567890' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
