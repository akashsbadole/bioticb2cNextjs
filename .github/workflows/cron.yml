name: Scheduled jobs (cron)

on:
  schedule:
    - cron: "0 3 * * *"     # session cleanup daily at 03:00 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  cleanup-sessions:
    runs-on: ubuntu-latest
    name: Purge expired sessions
    steps:
      - name: Hit /api/cron/cleanup-sessions
        run: |
          curl -fsS -m 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/cleanup-sessions"
